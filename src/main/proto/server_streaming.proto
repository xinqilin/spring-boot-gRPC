syntax = "proto3";

package streaming.serverstreaming;

option java_multiple_files = true;
option java_package = "com.bill.streaming.grpc.serverstreaming";
option java_outer_classname = "ServerStreamingProto";

import "common.proto";

// Server-streaming：一個請求，Server 陸續推送多筆回應，最後才 onCompleted()。
// 適合「訂閱通知」「即時報價」這類場景。
service ServerStreamingGreeter {
  rpc Subscribe(streaming.common.HelloRequest) returns (stream streaming.common.HelloReply) {}

  // 同樣是 server-streaming，但 server 依 client 的消化速度推送（flow control / 背壓）。
  rpc SubscribeWithFlowControl(streaming.common.HelloRequest) returns (stream streaming.common.HelloReply) {}
}
